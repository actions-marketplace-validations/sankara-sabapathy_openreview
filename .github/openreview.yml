version: 1
defaults:
  ignore: ["**.lock", "dist/**", "website/build/**"]
  max_diff_chars: 80000
providers:
  opencode:
    kind: opencode
    model: glm-5.3-flash
    key_from: secrets.OPENCODE_API_KEY
    base_url: https://opencode.ai/zen/go/v1
reviews:
  - id: general-quality
    main:
      provider: opencode
      instructions: "Synthesize findings. Strict on bugs, lenient on style."
    subagents:
      - name: correctness
        provider: opencode
        instructions: "Bugs, races, missing tests."
    verdict: { mode: comment }
global_verdict: { strategy: any_blocking, sticky_comment: true }
