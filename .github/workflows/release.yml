name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
  move-major:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move v1 tag to release
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}" # e.g. v0.2.0
          MAJOR=$(echo "$TAG" | cut -d. -f1) # v0
          git fetch --tags
          git tag -f "$MAJOR" "$TAG"
          git push origin "$MAJOR" --force
