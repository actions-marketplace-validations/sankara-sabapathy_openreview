name: Probe (temporary latency benchmark, do not merge)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tiny-prompt baseline per model (timings only, no bodies/keys printed)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          call() { # $1=label $2=json-body $3=extra-headers
            echo "--- $1 ---"
            # shellcheck disable=SC2086
            curl -s -o /dev/null -w "http=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s\n" \
              --max-time 120 \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OPENCODE_API_KEY" \
              $3 -d "$2" \
              https://opencode.ai/zen/go/v1/chat/completions
          }
          MIN='{"model":"deepseek-v4-flash","messages":[{"role":"user","content":"Say ok."}]}'
          FULL=$(python3 -c "import json; print(json.dumps({'model':'deepseek-v4-flash','messages':[{'role':'system','content':'Be terse.'},{'role':'user','content':'Say ok.'}],'temperature':0.2,'max_tokens':2000,'response_format':{'type':'json_object'}}))")
          call "A minimal, no session header" "$MIN" ""
          call "B minimal + session header" "$MIN" "-H 'x-opencode-session: probe-1' -H 'User-Agent: OpenReview-probe/1.0'"
          call "C full our-shape + session" "$FULL" "-H 'x-opencode-session: probe-2' -H 'User-Agent: OpenReview-probe/1.0'"
          call "D full our-shape, no session" "$FULL" ""
      - name: Medium prompt on deepseek (review-like input size)
        if: false
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          python3 -c "print(open('src/providers.ts').read() * 3)" > /tmp/code.txt
          wc -c /tmp/code.txt
          body=$(python3 - <<'EOF'
          import json
          code = open('/tmp/code.txt').read()[:12000]
          print(json.dumps({"model": "deepseek-v4-flash",
            "messages": [{"role": "system", "content": "You are a senior code reviewer. Return ONLY valid JSON: {\"findings\":[]}."},
                         {"role": "user", "content": "Review this diff:\n\n" + code}],
            "max_tokens": 500, "temperature": 0.2, "response_format": {"type": "json_object"}}))
          EOF
          )
          echo "--- deepseek medium (~12KB in, 500 out) ---"
          curl -s -o /dev/null -w "http=%{http_code} connect=%{time_connect}s ttfb=%{time_starttransfer}s total=%{time_total}s dl=%{size_download}B\n" \
            --max-time 420 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            -H "User-Agent: OpenReview-probe/1.0" \
            -d "$body" \
            https://opencode.ai/zen/go/v1/chat/completions
