name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run package
      - name: Check dist/ is committed and fresh
        run: git diff --exit-code -- dist/ || (echo "::error::dist/ is stale. Run npm run build && npm run package and commit." && exit 1)
      - run: node dist-src/validate.js openreview.example.yml
