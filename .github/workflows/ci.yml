name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build
      - run: node dist-src/validate.js openreview.example.yml
